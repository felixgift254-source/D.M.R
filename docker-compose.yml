services:
  # ─── PostgreSQL Database ───
  dmr-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - dmr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmr_user -d dmr_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Express Backend ───
  dmr-backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      dmr-db:
        condition: service_healthy
    ports:
      - "5000:5000"

  # ─── React Frontend (Nginx) ───
  dmr-frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - dmr-backend
    ports:
      - "80:80"

volumes:
  dmr_pgdata:
